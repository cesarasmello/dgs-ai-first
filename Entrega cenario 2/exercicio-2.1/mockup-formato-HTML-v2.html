            writer.close();

            while (true) {
              const { done, value } = await reader.read();

              chunks.push(value);

    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

    const doc = new DOMParser().parseFromString(template, 'text/html');

:1px solid var(--card-border);border-radius:10px;\n    overflow:hidden;box-shadow:0 6px 26px rgba(37,36,54,.10);}\n  .teams-titlebar{background:var(--teams-purple);height:34px;display:flex;align-items:center;\n    gap:8px;padding:0 12px;}\n  .tb-dots{display:flex;gap:6px;}\n  .tb-dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45);display:block;}\n  .tb-title{color:#fff;font-size:12px;font-weight:600;opacity:.95;margin-left:4px;}\n  .tb-search{margin-left:auto;background:rgba(255,255,255,.18);border-radius:5px;height:20px;width:200px;}\n\n  /* chat header (channel) */\n  .chat-head{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);}\n  .chat-head .ava{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#6e72d6,#4f52b2);\n    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none;}\n  .chat-head .ttl{font-size:15px;font-weight:700;line-height:1.1;}\n  .chat-head .sub{font-size:12px;color:var(--ink-3);}\n  .chat-head .tabs{margin-left:auto;display:flex;gap:18px;font-size:13px;color:var(--ink-3);}\n  .chat-head .tabs .on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--teams-purple);padding-bottom:13px;margin-bottom:-13px;}\n\n  /* chat scroll surface */\n  .thread{padding:20px 20px 6px;display:flex;flex-direction:column;gap:4px;background:var(--chat-bg);}\n  .daysep{display:flex;align-items:center;gap:12px;color:var(--ink-4);font-size:11px;margin:6px 0 12px;}\n  .daysep::before,.daysep::after{content:\"\";height:1px;background:var(--line);flex:1;}\n\n  /* attendant (outgoing) message */\n  .turn{margin-bottom:18px;}\n  .msg-me{display:flex;justify-content:flex-end;}\n  .bubble-me{background:var(--bubble-me);color:var(--ink);border-radius:8px 8px 2px 8px;\n    padding:9px 13px;font-size:14px;max-width:74%;box-shadow:0 1px 1px rgba(0,0,0,.04);}\n  .bubble-me .who{font-size:11px;color:var(--teams-purple-dk);font- eu-bg);color:var(--neu);}\n  .conf .dot{width:9px;height:9px;border-radius:50%;background:currentColor;}\n\n  .answer{font-size:14px;color:var(--ink);margin:0 0 13px;text-wrap:pretty;}\n  .answer .num{font-weight:700;color:var(--teams-purple-dk);white-space:nowrap;}\n\n  /* version blocks (conflict) */\n  .ver{border:1px solid var(--card-border);border-radius:7px;padding:11px 13px;margin-bottom:9px;\n    display:flex;align-items:flex-start;gap:12px;}\n  .ver.now{border-left:4px solid var(--hi);background:var(--hi-bg);}\n  .ver.old{border-left:4px solid var(--att);background:var(--att-bg);}\n  .ver .vinfo{flex:1;min-width:0;}\n  .ver .vdoc{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink);}\n  .ver .vval{font-size:13px;color:var(--ink-2);margin-top:2px;}\n  .ver .vval b{font-size:15px;color:var(--ink);}\n  .ver .vtag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:11px;white-space:nowrap;flex:none;}\n  .ver.now .vtag{background:var(--hi);color:#fff;}\n  .ver.old .vtag{background:var(--att);color:#fff;}\n  .ver .vnote{font-size:11.5px;color:var(--ink-3);margin-top:4px;}\n\n  /* fonte block */\n  .fonte{border-top:1px solid var(--line);margin:0 -17px;padding:11px 17px 0;}\n  .fonte .lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);margin-bottom:7px;}\n  .src{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);margin-bottom:5px;}\n  .src .ic{width:22px;height:22px;border-radius:4px;background:#eef0fb;color:var(--teams-purple-dk);\n    display:flex;align-items:center;justify-content:center;flex:none;}\n  .src .ic svg{width:13px;height:13px;}\n  .src code{font-family:var(--mono);font-weight:700;color:var(--ink);font-size:12.5px;}\n  .src .sec{color:var(--ink-3);}\n\n  /* notice strips */\n  .strip{display:flex;gap:9px;align-items:flex-start;border-radius:7px;padding:10px 12px;font-size:13px;margin-bottom:12px;}\n  .strip .ic{flex:none;margin-top:1px;}\n  .strip.warn{background:var(--low-bg);color:#7a1f30;border:1px solid #f4ccd3;}\n  .strip.att{background:var(--att-bg);color:#7a4400;border:1px solid #f0dcc0;}\n  .strip.neu{background:var(--neu-bg);color:#3f4654;border:1px solid #dde1ea;}\n  .strip b{font-weight:700;}\n\n  /* card actions */\n  .actions{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);margin:13px -17px 0;padding:12px 17px;}\n  .btn{font-family:var(--sans);font-size:13px;font-weight:600;border-radius:5px;padding:7px 14px;cursor:default;\n    border:1px solid var(--card-border);background:#fff;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;}\n  .btn.primary{background:var(--teams-purple);border-color:var(--teams-purple);color:#fff;}\n  .btn.primary.alert{background:var(--low);border-color:var(--low);}\n  .btn svg{width:14px;height:14px;}\n\n  /* recommended next action (decision support) */\n  .next{display:flex;align-items:baseline;gap:10px;background:#f3f4fb;border:1px solid #e3e5f6;\n    border-left:3px solid var(--teams-purple);border-radius:6px;padding:9px 12px;margin-bottom:13px;}\n  .next .lbl2{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;\n    color:var(--teams-purple-dk);white-space:nowrap;flex:none;}\n  .next .txt{font-size:13px;font-weight:600;color:var(--ink);text-wrap:pretty;}\n  .next.warn{background:var(--low-bg);border-color:#f1c6cf;border-left-color:var(--low);}\n  .next.warn .lbl2{color:var(--low);}\n\n  .code.fix{color:var(--att);background:var(--att-bg);border-color:#f0dcc0;}\n\n  /* composer */\n  .composer{padding:12px 20px 18px;border-top:1px solid var(--line);}\n  .composer .box{border:1px solid var(--card-border);border-radius:7px;height:42px;display:flex;align-items:center;\n    padding:0 14px;color:var(--ink-4);font-size:13px;gap:10px;}\n  .composer .send{margin-left:auto;color:var(--teams-purple);}\n\n  /* ---------- annotation gutter ---------- */\n  .gutter{position:sticky;top:18px;}\n  .gut-head{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);\n    margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--card-border);}\n  .ann-group{margin-bottom:18px;}\n  .ann-grp-ttl{font-size:11px;font-weight:700;color:var(--teams-purple-dk);text-transform:uppercase;\n    letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:6px;}\n  .ann-grp-ttl .n{width:17px;height:17px;border-radius:50%;background:var(--teams-purple);color:#fff;\n    font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;}\n  .ann{position:relative;padding:8px 0 8px 13px;border-left:2px solid var(--line);margin-left:7px;}\n  .ann::before{content:\"\";position:absolute;left:-5px;top:13px;width:8px;height:8px;border-radius:50%;\n    background:#fff;border:2px solid var(--teams-purple);}\n  .ann .codes{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px;}\n  .ann .code{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--teams-purple-dk);\n    background:#eef0fb;border:1px solid #dadcf6;border-radius:3px;padding:1px 5px;}\n  .ann .el{font-size:10.5px;font-weight:700;color:var(--ink-3);}\n  .ann .el::before{content:\"↳ \";color:var(--ink-4);}\n  .ann .desc{font-size:12px;color:var(--ink-2);margin-top:2px;text-wrap:pretty;}\n\n  /* legend footer */\n  .legend{max-width:1180px;margin:30px auto 0;background:#fff;border:1px solid var(--card-border);\n    border-radius:9px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start;}\n  .legend .blk{font-size:12px;color:var(--ink-3);}\n  .legend .blk h4{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-4);}\n  .legend .lg-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;}\n  .legend .sw{width:11px;height:11px;border-radius:3px;flex:none;}\n  .legend .note{flex:1;min-width:220px;border-left:2px solid var(--line);padding-left:14px;}\n\n  @media (max-width:980px){\n    .stage{grid-template-columns:1fr;}\n    .gutter{position:static;margin-top:24px;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  <header class=\"page-head\">\n    <h1>Resposta do Assistente NovaTech no Microsoft Teams — Mockup anotado · v2<\u002Fh1>\n    <p>Versão ajustada após a revisão técnica do Tech Lead. As mudanças são <b>exclusivamente de interface<\u002Fb> — clareza, hierarquia, rótulos, mensagens de estado e componentes de interação. Nenhum requisito de produto, regra de negócio ou critério de aceite foi alterado. Os quatro estados mantêm os elementos obrigatórios: resposta principal, fonte (documento + seção), indicador de confiança, baixa confiança com escalonamento, conflito de versões e ausência de evidência.<\u002Fp>\n    <div class=\"meta-row\">\n      <span class=\"meta-chip\">Fonte da especificação: <b>requirements.md v1.0<\u002Fb><\u002Fspan>\n      <span class=\"meta-chip\">Revisão: <b>ajustes de interface (Tech Lead)<\u002Fb><\u002Fspan>\n      <span class=\"meta-chip\">Idioma: <b>pt-BR formal (CN-05)<\u002Fb><\u002Fspan>\n      <span class=\"meta-chip\">Decisão em <b>&lt; 30 s (OUT-01 / CN-06)<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div class=\"stage\">\n\n    <!-- ============ TEAMS WINDOW ============ -->\n    <main class=\"teams\">\n      <div class=\"teams-titlebar\">\n        <span class=\"tb-dots\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan>\n        <span class=\"tb-title\">Microsoft Teams<\u002Fspan>\n        <span class=\"tb-search\"><\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"chat-head\">\n        <div class=\"ava\">N<\u002Fdiv>\n        <div>\n          <div class=\"ttl\">Assistente NovaTech<\u002Fdiv>\n          <div class=\"sub\">Bot · Suporte ao atendimento · Operações<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tabs\"><span class=\"on\">Conversa<\u002Fspan><span>Sobre<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"thread\">\n        <div class=\"daysep\">Hoje<\u002Fdiv>\n\n        <!-- ===== TURN 1 — normal, fonte + confiança alta ===== -->\n        <section class=\"turn\">\n          <div class=\"msg-me\">\n            <div class=\"bubble-me\">\n              <div class=\"who\">Atendente · Camila R.<\u002Fdiv>\n              Qual o prazo para reembolso de uma devolução?\n              <div class=\"t\">10:21<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"msg-bot\">\n            <div class=\"bot-ava\">N<\u002Fdiv>\n            <div class=\"bot-col\">\n              <div class=\"bot-meta\"><b>Assistente NovaTech<\u002Fb><span class=\"badge-bot\">BOT<\u002Fspan><span class=\"t\">10:21<\u002Fspan><\u002Fdiv>\n              <div class=\"card\">\n                <div class=\"card-accent\"><\u002Fdiv>\n                <div class=\"card-body\">\n                  <div class=\"card-head\">\n                    <span class=\"card-kicker\">Resposta<\u002Fspan>\n                    <span class=\"conf hi\" title=\"Confiança alta\">\n                      <span class=\"meter\"><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><\u002Fspan>\n                      Confiança alta\n                    <\u002Fspan>\n                  <\u002Fdiv>\n                  <p class=\"answer\">O reembolso de devolução é processado em <span class=\"num\">até 5 dias úteis<\u002Fspan>, contados a partir do recebimento da mercadoria no Centro de Distribuição (CD).<\u002Fp>\n                  <div class=\"next\">\n                    <span class=\"lbl2\">Ação recomendada<\u002Fspan>\n                    <span class=\"txt\">Informe ao cliente: reembolso em até 5 dias úteis após o recebimento no CD.<\u002Fspan>\n                  <\u002Fdiv>\n                  <div class=\"fonte\">\n                    <div class=\"lbl\">Fonte<\u002Fdiv>\n                    <div class=\"src\">\n                      <span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 3v5h5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span><code>POL-001<\u002Fcode> &nbsp;·&nbsp; <span class=\"sec\">§3.3 — Reembolso de devolução<\u002Fspan><\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"actions\">\n                    <button class=\"btn primary\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 3v5h5\"><\u002Fpath><\u002Fsvg>Abrir POL-001 §3.3<\u002Fbutton>\n                    <button class=\"btn\">Copiar resposta<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- ===== TURN 2 — conflito de versões ===== -->\n        <section class=\"turn\">\n          <div class=\"msg-me\">\n            <div class=\"bubble-me\">\n              <div class=\"who\">Atendente · Camila R.<\u002Fdiv>\n              Qual o fator de peso para uma carga de 2.000 kg?\n              <div class=\"t\">10:23<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"msg-bot\">\n            <div class=\"bot-ava\">N<\u002Fdiv>\n            <div class=\"bot-col\">\n              <div class=\"bot-meta\"><b>Assistente NovaTech<\u002Fb><span class=\"badge-bot\">BOT<\u002Fspan><span class=\"t\">10:23<\u002Fspan><\u002Fdiv>\n              <div class=\"card\">\n                <div class=\"card-accent\"><\u002Fdiv>\n                <div class=\"card-body\">\n                  <div class=\"card-head\">\n                    <span class=\"card-kicker\">Resposta · Conflito de versões<\u002Fspan>\n                    <span class=\"conf hi\" title=\"Confiança alta, conflito sinalizado\">\n                      <span class=\"meter\"><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><\u002Fspan>\n                      Confiança alta\n                    <\u002Fspan>\n                  <\u002Fdiv>\n                  <p class=\"answer\">Existem duas versões vigentes do <b>PROC-042<\u002Fb> com valores divergentes. Para <b>chamados novos<\u002Fb>, adote o valor do <b>PROC-042-v2<\u002Fb>.<\u002Fp>\n\n                  <div class=\"ver now\">\n                    <div class=\"vinfo\">\n                      <div class=\"vdoc\">PROC-042-v2<\u002Fdiv>\n                      <div class=\"vval\">Fator de peso: <b>1.15<\u002Fb><\u002Fdiv>\n                      <div class=\"vnote\">Padrão para chamados novos — a partir de 01/12/2023.<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span class=\"vtag\">Vigente<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div class=\"ver old\">\n                    <div class=\"vinfo\">\n                      <div class=\"vdoc\">PROC-042 v1<\u002Fdiv>\n                      <div class=\"vval\">Fator de peso: <b>1.2<\u002Fb><\u002Fdiv>\n                      <div class=\"vnote\">Aplicável apenas a contratos anteriores a 01/12/2023.<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span class=\"vtag\">Versão anterior<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div class=\"strip att\">\n                    <span class=\"ic\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span>Para contratos anteriores a 01/12/2023, <b>confirme a versão aplicável com o Comercial<\u002Fb>.<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div class=\"next\">\n                    <span class=\"lbl2\">Ação recomendada<\u002Fspan>\n                    <span class=\"txt\">Para chamados novos, aplique o fator de peso <b>1.15<\u002Fb> (PROC-042-v2).<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div class=\"fonte\">\n                    <div class=\"lbl\">Fonte<\u002Fdiv>\n                    <div class=\"src\">\n                      <span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 3v5h5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span><code>PROC-042-v2<\u002Fcode> &nbsp;·&nbsp; <span class=\"sec\">Tabela de fator de peso<\u002Fspan><\u002Fspan>\n                    <\u002Fdiv>\n                    <div class=\"src\">\n                      <span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 3v5h5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span><code>PROC-042 v1<\u002Fcode> &nbsp;·&nbsp; <span class=\"sec\">Tabela de fator de peso (versão anterior)<\u002Fspan><\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"actions\">\n                    <button class=\"btn primary\">Abrir PROC-042-v2<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- ===== TURN 3 — baixa confiança + escalar ===== -->\n        <section class=\"turn\">\n          <div class=\"msg-me\">\n            <div class=\"bubble-me\">\n              <div class=\"who\">Atendente · Camila R.<\u002Fdiv>\n              Como faço para interceptar uma carga que já está em trânsito?\n              <div class=\"t\">10:25<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"msg-bot\">\n            <div class=\"bot-ava\">N<\u002Fdiv>\n            <div class=\"bot-col\">\n              <div class=\"bot-meta\"><b>Assistente NovaTech<\u002Fb><span class=\"badge-bot\">BOT<\u002Fspan><span class=\"t\">10:25<\u002Fspan><\u002Fdiv>\n              <div class=\"card\">\n                <div class=\"card-accent low\"><\u002Fdiv>\n                <div class=\"card-body\">\n                  <div class=\"card-head\">\n                    <span class=\"card-kicker\">Resposta · Confiança baixa<\u002Fspan>\n                    <span class=\"conf low\" title=\"Confiança baixa\">\n                      <span class=\"meter\"><i class=\"on\"><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan>\n                      Confiança baixa\n                    <\u002Fspan>\n                  <\u002Fdiv>\n                  <p class=\"answer\">O <b>POL-001 §2<\u002Fb> referencia o <b>PROC-088<\u002Fb> para mercadorias em trânsito, porém esse documento não está disponível no corpus consultado. Não é possível detalhar o procedimento com base nas fontes atuais.<\u002Fp>\n\n                  <div class=\"strip warn\">\n                    <span class=\"ic\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                    <span><b>Confiança baixa — evidência apenas parcial.<\u002Fb> O documento aplicável (PROC-088) é referenciado em POL-001 §2, mas não consta do corpus consultado; não é seguro responder com base nas fontes atuais.<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div class=\"next warn\">\n                    <span class=\"lbl2\">Ação recomendada<\u002Fspan>\n                    <span class=\"txt\">Escalar ao supervisor para tratamento humano do caso.<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div class=\"fonte\">\n                    <div class=\"lbl\">Fonte parcial<\u002Fdiv>\n                    <div class=\"src\">\n                      <span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 3v5h5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span><code>POL-001<\u002Fcode> &nbsp;·&nbsp; <span class=\"sec\">§2 — referência ao PROC-088 (fora do corpus)<\u002Fspan><\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"actions\">\n                    <button class=\"btn primary alert\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M22 11.08V12a10 10 0 1 1-5.93-9.14\"><\u002Fpath><path d=\"m9 11 3 3L22 4\"><\u002Fpath><\u002Fsvg>Escalar ao supervisor<\u002Fbutton>\n                    <button class=\"btn\">Reformular pergunta<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- ===== TURN 4 — sem evidência suficiente ===== -->\n        <section class=\"turn\">\n          <div class=\"msg-me\">\n            <div class=\"bubble-me\">\n              <div class=\"who\">Atendente · Camila R.<\u002Fdiv>\n              Qual o valor do frete para uma carga de 300 kg?\n              <div class=\"t\">10:27<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"msg-bot\">\n            <div class=\"bot-ava\">N<\u002Fdiv>\n            <div class=\"bot-col\">\n              <div class=\"bot-meta\"><b>Assistente NovaTech<\u002Fb><span class=\"badge-bot\">BOT<\u002Fspan><span class=\"t\">10:27<\u002Fspan><\u002Fdiv>\n              <div class=\"card\">\n                <div class=\"card-accent neu\"><\u002Fdiv>\n                <div class=\"card-body\">\n                  <div class=\"card-head\">\n                    <span class=\"card-kicker\">Resposta · Fora do escopo disponível<\u002Fspan>\n                    <span class=\"conf neu\" title=\"Sem evidência suficiente\">\n                      <span class=\"dot\"><\u002Fspan>\n                      Sem evidência suficiente\n                    <\u002Fspan>\n                  <\u002Fdiv>\n                  <p class=\"answer\">O escopo disponível cobre apenas <b>frete especial<\u002Fb>, aplicável a cargas <b>acima de 500 kg<\u002Fb>. Não há documento normativo ingerido para frete de cargas abaixo de 500 kg — portanto não é possível informar valor ou fórmula.<\u002Fp>\n\n                  <div class=\"strip neu\">\n                    <span class=\"ic\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 16v-4m0-4h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                    <span><b>Sem evidência — tema fora do escopo documental.<\u002Fb> Não há documento aplicável no corpus para frete abaixo de 500 kg; portanto nenhum valor ou fórmula é apresentado.<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div class=\"next\">\n                    <span class=\"lbl2\">Ação recomendada<\u002Fspan>\n                    <span class=\"txt\">Encaminhe o cliente ao Comercial para cotação de frete padrão.<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div class=\"fonte\">\n                    <div class=\"lbl\">Fonte<\u002Fdiv>\n                    <div class=\"src\">\n                      <span class=\"ic\" style=\"background:var(--neu-bg);color:var(--neu);\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span class=\"sec\">Sem fonte aplicável no corpus — nenhum valor é apresentado.<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"actions\">\n                    <button class=\"btn\">Ver escopo de frete especial<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n      <\u002Fdiv>\n\n      <div class=\"composer\">\n        <div class=\"box\">\n          <span>Pergunte ao Assistente NovaTech…<\u002Fspan>\n          <span class=\"send\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"m22 2-7 20-4-9-9-4 20-7z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n\n    <!-- ============ ANNOTATION GUTTER ============ -->\n    <aside class=\"gutter\">\n      <div class=\"gut-head\">Rastreabilidade · requisito → elemento<\u002Fdiv>\n\n      <div class=\"ann-group\">\n        <div class=\"ann-grp-ttl\"><span class=\"n\">1<\u002Fspan> Resposta padrão<\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code\">OUT-01<\u002Fspan><span class=\"code\">CN-06<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Resposta principal<\u002Fdiv>\n          <div class=\"desc\">Regra objetiva e legível para decisão em &lt; 30 s.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code\">CN-02<\u002Fspan><span class=\"code\">CV-03<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Bloco “Fonte”<\u002Fdiv>\n          <div class=\"desc\">Citação obrigatória: documento + seção (POL-001 §3.3).<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code\">OUT-02<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Indicador de confiança<\u002Fdiv>\n          <div class=\"desc\">Sustenta auditoria e contestação fundamentada.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code\">OUT-01<\u002Fspan><span class=\"code\">CN-06<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Linha “Ação recomendada”<\u002Fdiv>\n          <div class=\"desc\">Próximo passo explícito em todos os estados — acelera a decisão em &lt; 30 s.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ann-group\">\n        <div class=\"ann-grp-ttl\"><span class=\"n\">2<\u002Fspan> Conflito de versões<\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code\">OUT-03<\u002Fspan><span class=\"code\">CN-03<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Blocos v2 / v1<\u002Fdiv>\n          <div class=\"desc\">Conflito exposto, não silenciado; ambos os valores visíveis.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code\">ADR-0003<\u002Fspan><span class=\"code\">CV-05<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Selo “Vigente”<\u002Fdiv>\n          <div class=\"desc\">PROC-042-v2 como padrão para chamados novos (01/12/2023).<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code\">CN-03<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Ressalva âmbar<\u002Fdiv>\n          <div class=\"desc\">Avisa versão anterior e remete contratos antigos ao Comercial.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code fix\">A-11<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Botão “Comparar versões” removido<\u002Fdiv>\n          <div class=\"desc\">Eliminado por não ter requisito correspondente; mantido apenas “Abrir PROC-042-v2”.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ann-group\">\n        <div class=\"ann-grp-ttl\"><span class=\"n\">3<\u002Fspan> Confiança baixa<\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code\">CN-01<\u002Fspan><span class=\"code\">OQ-04<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Texto da resposta<\u002Fdiv>\n          <div class=\"desc\">Sem alucinação: PROC-088 referenciado mas fora do corpus.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code fix\">A-06<\u002Fspan><span class=\"code fix\">DP-03<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Botão “Escalar ao supervisor”<\u002Fdiv>\n          <div class=\"desc\">Exibido na baixa confiança → roteia para atendimento humano. Critério formal de exibição segue pendente (OQ-01 / DP-03).<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code fix\">A-15<\u002Fspan><span class=\"code fix\">AMB-02<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Microcopy do estado<\u002Fdiv>\n          <div class=\"desc\">“Evidência apenas parcial” distingue este estado de “Sem evidência”. Atribuição formal: DP-02 (pendente).<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code\">CN-07<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Medidor + fonte parcial<\u002Fdiv>\n          <div class=\"desc\">Metadados de rastreabilidade preservados mesmo na lacuna.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ann-group\">\n        <div class=\"ann-grp-ttl\"><span class=\"n\">4<\u002Fspan> Sem evidência<\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code\">CN-10<\u002Fspan><span class=\"code\">CV-04<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Texto da resposta<\u002Fdiv>\n          <div class=\"desc\">Frete &lt; 500 kg fora do escopo; nenhum valor ou fórmula.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code\">CN-01<\u002Fspan><span class=\"code\">NG-07<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Selo “Sem evidência” + “Sem fonte”<\u002Fdiv>\n          <div class=\"desc\">Lacuna sinalizada explicitamente; ausência de fonte declarada.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code\">CN-01<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Faixa neutra<\u002Fdiv>\n          <div class=\"desc\">Orientação de encaminhamento ao Comercial.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ann\">\n          <div class=\"codes\"><span class=\"code fix\">A-15<\u002Fspan><span class=\"code fix\">AMB-02<\u002Fspan><\u002Fdiv>\n          <div class=\"el\">Microcopy do estado<\u002Fdiv>\n          <div class=\"desc\">“Fora do escopo documental” contrasta com a baixa confiança (documento ausente vs. inexistente).<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n\n  <\u002Fdiv>\n\n  <!-- ============ LEGEND ============ -->\n  <div class=\"legend\">\n    <div class=\"blk\">\n      <h4>Indicador de confiança<\u002Fh4>\n      <div class=\"lg-row\"><span class=\"sw\" style=\"background:var(--hi)\"><\u002Fspan> <b>Alta<\u002Fb> — 3 segmentos · evidência direta no corpus<\u002Fdiv>\n      <div class=\"lg-row\"><span class=\"sw\" style=\"background:var(--low)\"><\u002Fspan> <b>Baixa<\u002Fb> — 1 segmento · evidência parcial → escalar<\u002Fdiv>\n      <div class=\"lg-row\"><span class=\"sw\" style=\"background:var(--neu)\"><\u002Fspan> <b>Sem evidência<\u002Fb> — fora do escopo · nenhum documento aplicável<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"blk\">\n      <h4>Baixa confiança × Sem evidência<\u002Fh4>\n      <div class=\"lg-row\" style=\"align-items:flex-start\"><span class=\"sw\" style=\"background:var(--low);margin-top:3px\"><\u002Fspan> <span><b>Baixa:<\u002Fb> existe documento aplicável, porém ausente/incompleto no corpus. Resposta insegura → escalar ao supervisor.<\u002Fspan><\u002Fdiv>\n      <div class=\"lg-row\" style=\"align-items:flex-start\"><span class=\"sw\" style=\"background:var(--neu);margin-top:3px\"><\u002Fspan> <span><b>Sem evidência:<\u002Fb> não existe documento aplicável no corpus. Tema fora de escopo → encaminhar ao setor.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"note\">\n      <b>Ajustes desta revisão (escopo de interface).<\u002Fb> Removido o botão “Comparar versões” do estado de conflito (A-11, sem requisito correspondente). Distinção visual e textual reforçada entre “Confiança baixa” e “Sem evidência” (A-15 / AMB-02). Estado de escalonamento clarificado (A-06). Adicionada a linha “Ação recomendada” em todos os estados para decisão em &lt; 30 s. Critérios formais de atribuição de cada estado de confiança permanecem como decisão de produto pendente (DP-02) — não definidos aqui. Nenhum requisito, regra de negócio ou critério de aceite foi alterado.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
